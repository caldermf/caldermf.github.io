    <header class="site-header">
      <div class="wrap">
        {% unless page.permalink == '/' -%}
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.first_name }} {{ site.last_name }}</a>
        {%- endunless %}
        <nav class="site-nav" aria-label="Main">
          <ul>
            {%- assign sorted_pages = site.pages | sort: "nav_order" -%}
            {%- for p in sorted_pages -%}
            {%- if p.nav and p.autogen == nil %}
            <li><a href="{{ p.url | relative_url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
            {%- endif -%}
            {%- endfor %}
            <li><a href="{{ '/assets/pdf/cv.pdf' | relative_url }}">CV</a></li>
          </ul>
        </nav>
      </div>
    </header>
