{%- assign img_path = include.path | remove: '.jpg' | remove: '.jpeg' | remove: '.png' | remove: '.tiff' -%}
{%- assign dimensions = include.path | image_dimensions -%}
<figure>
  <picture>
    {% if site.imagemagick.enabled and dimensions %}
    {%- capture image_srcset -%}
      {%- assign previous_width = 0 -%}
      {%- for width in site.imagemagick.widths -%}
        {%- assign actual_width = width | at_most: dimensions[0] -%}
        {%- if actual_width > previous_width -%}
          {%- if previous_width > 0 -%}, {% endif -%}
          {{- img_path | relative_url -}}-{{ width }}.webp {{ actual_width }}w
          {%- assign previous_width = actual_width -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endcapture -%}
    <source type="image/webp"
      srcset="{{ image_srcset }}"
      sizes="{{ include.sizes | default: '(max-width: 575px) calc(100vw - 30px), 800px' }}">
    {% endif %}
    <img
      src="{% if include.cache_bust %}{{ include.path | relative_url | bust_file_cache }}{% else %}{{ include.path | relative_url }}{% endif %}"
      {% if include.class %}class="{{ include.class }}"{% endif %}
      {% if dimensions %}width="{{ dimensions[0] }}" height="{{ dimensions[1] }}"{% endif %}
      alt="{{ include.alt | default: '' | escape }}"
      {% if include.title %}title="{{ include.title | escape }}"{% endif %}
      loading="{{ include.loading | default: 'lazy' }}" decoding="async"
      {% if include.fetchpriority %}fetchpriority="{{ include.fetchpriority }}"{% endif %}
      {% if include.zoomable %}data-zoomable{% endif %}>
  </picture>
  {% if include.caption %}<figcaption class="caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
