{%- if site.orcid_id %}
        <li><a class="plain" href="https://orcid.org/{{ site.orcid_id }}">ORCID</a></li>
{%- endif %}
{%- if site.scholar_userid %}
        <li><a class="plain" href="https://scholar.google.com/citations?user={{ site.scholar_userid }}">Google Scholar</a></li>
{%- endif %}
{%- if site.github_username %}
        <li><a class="plain" href="https://github.com/{{ site.github_username }}">GitHub</a></li>
{%- endif %}
{%- if site.linkedin_username %}
        <li><a class="plain" href="https://www.linkedin.com/in/{{ site.linkedin_username }}/">LinkedIn</a></li>
{%- endif %}
