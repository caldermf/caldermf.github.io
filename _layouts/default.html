<!DOCTYPE html>
<html lang="{{ site.lang }}">

  <!-- Head -->
  <head>
  {%- if page.redirect_to -%}
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}" />
  {%- endif -%}
  {% include head.html %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TVF7TW33PR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-TVF7TW33PR');
</script>
  </head>

  <!-- Body -->
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- Header -->
    {%- include header.html %}

    <!-- Content -->
    <main id="main-content" class="wrap" tabindex="-1">
      {{ content }}
    </main>

    <!-- Footer -->
    {%- include footer.html %}

    <!-- JavaScripts -->
    {% include scripts/site.html %}
    {% include scripts/mathjax.html %}
  </body>
</html>
