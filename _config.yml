lang: en
icon: 🍁
url: https://caldermf.github.io
baseurl: ""
last_updated: false
highlight_theme_light: github
highlight_theme_dark: native
navbar_fixed: true
footer_fixed: true
max_width: 800px
github_username: caldermf
linkedin_username: calder-morton-ferguson-b7396624a
scholar_userid: z7yGETJzTboC
orcid_id: 0000-0002-1955-9109
collections:
  projects:
    output: true
    permalink: "/projects/:path/"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
- _pages
exclude:
- AGENTS.md
- Dockerfile
- docker-compose.yml
- bin
- docs
- Gemfile
- Gemfile.lock
- vendor
- burnside-sampler/README.md
- burnside-sampler/tests
- burnside-sampler/run_tests.sh
- burnside-sampler/serve_web.sh
keep_files:
- CNAME
- ".nojekyll"
- ".git"
plugins:
- jekyll-email-protect
- jekyll-imagemagick
- jekyll-link-attributes
- jekyll-minifier
- jekyll-scholar
- jekyll-sitemap
defaults:
- scope:
    path: assets
  values:
    sitemap: false
- scope:
    path: burnside-sampler
  values:
    sitemap: false
jekyll-minifier:
  exclude:
  - robots.txt
  - llms.txt
  - publications.json
  - profile.json
  - publications.md
  - publications.bib
scholar:
  last_name:
  - Morton-Ferguson
  first_name:
  - Calder
  style: apa
  locale: en
  source: "/_bibliography/"
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
  - latexwithmath
  - smallcaps
  - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  # arXiv IDs retain the first submission's year/month and sequence number.
  sort_by: arxiv
  order: descending
  group_by: arxiv_year
  group_order: descending
filtered_bibtex_keywords:
- abbr
- abstract
- arxiv
- bibtex_show
- html
- pdf
- selected
- supp
- blog
- code
- poster
- slides
- website
- preview
- altmetric
max_author_limit: 5
more_authors_animation_delay: 10
external_links:
  enabled: true
  rel: external noopener
  target: _blank
  exclude: []
imagemagick:
  enabled: true
  widths:
  - 160
  - 320
  - 480
  - 800
  input_directories:
  - assets/img/
  input_formats:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".tiff"
  output_formats:
    webp: "-strip -quality 82"
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_medium_zoom: false
enable_progressbar: true
